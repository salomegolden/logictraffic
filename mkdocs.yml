site_name: LogicTraffic
site_description: Dokumentation für das LogicTraffic-Projekt
site_author: Salome Gwendolin Guldener
repo_name: logictraffic
repo_url: https://github.com/salomegolden/logictraffic
site_url: https://salomegolden.github.io/logictraffic/
docs_dir: docs
edit_uri: edit/main/docs/


theme:
  name: material
    font: Noto Sans
    code: Roboto Mono  # Für Code-Blöcke
  language: de
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.path
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share
    - content.tooltips
  icon:
    # --- NEU: Logo-Icon angepasst ---
    logo: material/traffic-light  # Ein Ampel-Icon für den Header
    admonition:
      note: octicons/compose-24
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/light-bulb-24
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
      teacher: material/human-male-board
      logictraffic: material/traffic-light-outline
      student: material/lightbulb-group-outline
      error: material/head-alert
      meta: material/web-plus
  palette:
    # Hell (als Standard)
    - scheme: default
      primary: light-blue    # Oder eine Standardfarbe, die wir per CSS überschreiben
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: In den dunklen Modus
    # Dunkel (Optional, aber gut zu haben)
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: In den hellen Modus

nav:
  - Home: index.md
  - Überblick: overview.md
  - Zur Sache: 
      - topic.md
      - Darstellungswechsel: topic/darstellungswechsel.md
      - Normalformeln: topic/normalformen.md
      - Wahrheitstabellen: topic/wahrheitstabellen.md
  - Lehrplan und Lernziele: goals.md
  - Unterrichtsplanung: 
      - lessons.md
      - Konfrontationsaufgaben: lessons/konfrontationsaufgaben.md
      - Erarbeitungsaufgaben: lessons/erarbeitungsaufgaben.md
      - Übungsaufgaben: lessons/übungsaufgaben.md
      - Vertiefungsaufgaben: lessons/vertiefungsaufgaben.md
      - Syntheseaufgaben: lessons/syntheseaufgaben.md
      - Transferaufgaben: lessons/transferaufgaben.md
      - formative Beurteilungsaufgaben: lessons/formativebeurteilungsaufgaben.md
      - summative Beurteilungsaufgaben: lessons/summativebeurteilungsaufgaben.md
  - Downloads: downloads.md
  - Beispiele aus dem Unterricht: examples.md


markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_css: 
    - stylesheets/callouts.css
    - stylesheets/custom.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
