site_name: LogicTraffic
site_description: Dokumentation für das LogicTraffic-Projekt
site_author: Dein Name
repo_name: logictraffic
repo_url: https://github.com/<DEIN_GITHUB_USERNAME>/logictraffic

theme:
  name: material
  language: de
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.action.edit
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share

nav:
  - Home: docs/index.md
  - Überblick: docs/overview.md
  - Zur Sache: docs/topic.md
  - Lehrplan und Lernziele: docs/goals.md
  - Unterrichtsplanung: docs/lessons.md
  - Downloads: docs/downloads.md
  - Beispiele aus dem Unterricht: docs/examples.md

plugins:
  - search
  - awesome-pages
  - mermaid2
  - git-revision-date-localized:
      type: datetime
      fallback_to_build_date: true
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
  - plantuml-markdown

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.arithmatex
  - pymdownx.snippets

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/salomegolden/logictraffic

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

