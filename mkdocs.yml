site_name: LogicTraffic
site_description: Dokumentation für das LogicTraffic-Projekt
site_author: Salome Gwendolin Guldener
repo_name: logictraffic
repo_url: https://github.com/salomegolden/logictraffic
site_url: https://salomegolden.github.io/logictraffic/
docs_dir: docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  font:
    text: Roboto 
    code: Google Sans Code
  palette:
    primary: "#0C1EE7"
    accent: "#CC111A"
  features:
    - navigation.path
    - navigation.instant
    - navigation.indexes
    - navigation.footer
    - content.action.edit
    - content.action.view
  icon:
    admonition: 
      abstract: material/file-eye-outline
      quote: material/clipboard-text-outline
      tip: material/lightbulb-on-outline
      warning: material/alert-circle-outline
      example: material/check-decagram-outline
      info: material/book-education-outline
      question: material/chat-question-outline
      note: material/package-variant-closed

nav:
  - Start: index.md
  - Didaktische Hinweise:
      - Überblick: didaktik/index.md
      - Lehrplan und Lernziele: didaktik/lernziele.md
      - Aufbau der Unterrichtseinheit: didaktik/aufbau.md
      - Darstellungswechsel: didaktik/darstellungswechsel.md
      - Typische Lernschwierigkeiten: didaktik/lernschwierigkeiten.md
  - Unterricht durchführen:
      - Überblick: unterricht/index.md
      - Vorbereitung: unterricht/vorbereitung.md
      - "Baustein 1: Enaktiver Einstieg": unterricht/baustein1-enaktiv.md
      - "Baustein 2: Lernumgebung LogicTraffic": unterricht/baustein2-logictraffic.md
      - "Baustein 3: Wahrheitstabellen": unterricht/baustein3-wahrheitstabellen.md
      - "Baustein 4: Boolesche Algebra": unterricht/baustein4-boolesche-algebra.md
      - Differenzierung und Unterstützung: unterricht/differenzierung.md
      - Beurteilung: unterricht/beurteilung.md
  - Fachlicher Hintergrund:
      - Überblick: fachlicher-hintergrund/index.md
      - Logik: fachlicher-hintergrund/logik.md
      - Wahrheitstabellen: fachlicher-hintergrund/wahrheitstabellen.md
      - Boolesche Algebra: fachlicher-hintergrund/boolesche-algebra.md
      - Normalformen: fachlicher-hintergrund/normalformen.md
  - Anhang:
      - Überblick: anhang/index.md
      - Downloads: anhang/downloads.md
      - Glossar: anhang/glossar.md
      - Literatur: anhang/literatur.md
      - Hintergrund und Entwicklung: anhang/about.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.blocks.caption
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - code/javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
