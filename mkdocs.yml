site_name: LogicTraffic
site_description: Dokumentation für das LogicTraffic-Projekt
site_author: Salome Gwendolin Guldener
repo_name: logictraffic
repo_url: https://github.com/salomegolden/logictraffic
site_url: https://salomegolden.github.io/logictraffic/
docs_dir: docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  font:
    text: Nunito Sans
    code: Roboto Mono
  palette:
    - scheme: default
      primary: grey
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Dark Mode
    - scheme: slate
      primary: grey
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Light Mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share
    - content.tooltips
  icon:
    logo: material/traffic-light
    admonition:
      note: octicons/compose-24
      tip: material/lightbulb-on-outline
      success: material/check-decagram-outline
      warning: material/alert-decagram-outline
      failure: material/close-octagon-outline
      danger: material/lightning-bolt-outline

nav:
  - Home: index.md
  - Überblick: overview.md
  - Zur Sache: 
      - topic.md
      - Darstellungswechsel: topic/darstellungswechsel.md
      - Normalformeln: topic/normalformen.md
      - Wahrheitstabellen: topic/wahrheitstabellen.md
  - Lehrplan und Lernziele: goals.md
  - Unterrichtsplanung: 
      - lessons.md
      - Konfrontationsaufgaben: lessons/konfrontationsaufgaben.md
      - Erarbeitungsaufgaben: lessons/erarbeitungsaufgaben.md
      - Übungsaufgaben: lessons/übungsaufgaben.md
      - Vertiefungsaufgaben: lessons/vertiefungsaufgaben.md
      - Syntheseaufgaben: lessons/syntheseaufgaben.md
      - Transferaufgaben: lessons/transferaufgaben.md
      - formative Beurteilungsaufgaben: lessons/formativebeurteilungsaufgaben.md
      - summative Beurteilungsaufgaben: lessons/summativebeurteilungsaufgaben.md
  - Downloads: downloads.md
  - Beispiele aus dem Unterricht: examples.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_css: 
  - stylesheets/callouts.css
  - stylesheets/custom.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
