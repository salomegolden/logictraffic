site_name: LogicTraffic
site_description: Dokumentation für das LogicTraffic-Projekt
site_author: Dein Name
repo_name: logictraffic
repo_url: https://github.com/salomegolden/logictraffic
site_url: https://salomegolden.github.io/logictraffic/
docs_dir: docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share

nav:
  - Home: index.md
  - Überblick: overview.md
  - Zur Sache: topic.md
  - Lehrplan und Lernziele: goals.md
  - Unterrichtsplanung: lessons.md
  - Downloads: downloads.md
  - Beispiele aus dem Unterricht: examples.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - tables
  - attr_list


