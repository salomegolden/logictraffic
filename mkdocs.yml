site_name: LogicTraffic
site_description: Dokumentation für das LogicTraffic-Projekt
site_author: Salome Gwendolin Guldener
repo_name: logictraffic
repo_url: https://github.com/salomegolden/logictraffic
site_url: https://salomegolden.github.io/logictraffic/
docs_dir: docs
edit_uri: edit/main/docs/

theme:
  name: null
  custom_dir: theme
  language: de

nav:
  - Home: index.md
  - Sachinformationen:
      - Sachinformationen: topic/index.md
      - Darstellungswechsel: topic/darstellungswechsel.md
      - Wahrheitstabellen: topic/wahrheitstabellen.md
      - Normalformen: topic/normalformen.md
      - Lern- und Lehrherausforderungen: topic/difficulties.md
  - Unterrichtsziele: goals.md
  - Unterrichtsplanung:
    - Unterrichtsplanung: unterricht/index.md
    - Enaktiver Einstieg: unterricht/einstiegenaktiv.md
    - Einführung Online Lernumgebung: unterricht/logictraffic.md
    - Wahrheitstabelle: unterricht/wahrheitstabellen.md
    - Formeln verstehen: unterricht/formelnverstehen.md
  - Beurteilung: 
    - Beurteilung: beurteilung/index.md
    - Formative Beurteilungsaufgaben: beurteilung/formativebeurteilungsaufgaben.md
    - Summative Beurteilungsaufgaben: beurteilung/summativebeurteilungsaufgaben.md
  - Beispiele auf der Erprobung: examples.md
  - Downloads: downloads.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.blocks.caption
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_css: 
  - https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css
  - https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css
  - stylesheets/theme.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
