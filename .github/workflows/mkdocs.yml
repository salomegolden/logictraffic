name: Workflow Build and Deploy MkDocs 

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Minimal Dependencies
        run: |
          # Wir löschen ALLES Vorinstallierte, um MkDocs 2.0 loszuwerden
          pip uninstall -y mkdocs mkdocs-material
          # Wir installieren nur das Core-Design (das bringt ein passendes MkDocs mit)
          pip install "mkdocs-material<10.0"

      - name: Build MkDocs site
        # Kein --strict, damit wir bei kleinen Warnungen nicht abbrechen
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
